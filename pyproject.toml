[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-scheduling-benchmark"
version = "0.1.0"
description = "Multi-agent energy scheduling benchmark scenarios for mango-agents"
authors = [{name = "Rico Schrage"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["energy", "multi-agent", "power-systems", "scheduling", "benchmark", "pypsa"]
dependencies = [
    "mango-agents>=2.1",
    "mango-energy-environments>=0.1",
    "distributed-resource-optimization>=0.1",
    "pypsa>=0.29",
    "pandapower>=2.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "cvxpy>=1.5",
]

[project.optional-dependencies]
build = ["geopandas>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
esb-run = "energy_scheduling_benchmark.run:main"
esb-prepare = "energy_scheduling_benchmark.datasets:main"
esb-tune = "energy_scheduling_benchmark.tune:main"
esb-compare = "energy_scheduling_benchmark.compare:main"

[tool.uv.sources]
mango-energy-environments = { path = "../mango-energy-environments", editable = true }
distributed-resource-optimization = { path = "../distributed-resource-optimization", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE"]
ignore = ["E501"]
