%YAML 1.1
---
# ─────────────────────────────────────────────────────────────────────────────
# config/config.lower-saxony-2030.yaml
#
# Unclustered Germany electricity network, 2030 cost year, existing fleet plus
# coal/nuclear/lignite phase-out — the raw material for a Lower Saxony (NUTS1
# DE9) sub-network extract for the scheduling benchmark.
#
# PyPSA-Eur's `countries` list is country-level only; you cannot ask it for
# "just Lower Saxony". So this config builds the whole of Germany with NO
# clustering (`clusters: [all]` → identity busmap, every OSM substation kept)
# and the DE9* buses are sliced out afterwards with
#   energy-scheduling-benchmark/resources/networks/extract_lower_saxony.py
#
# "2030 estimated expansions" is handled in two layers:
#   1. here      — 2030 technology-data costs, coal/nuclear/lignite retired via
#                  `powerplants_filter` on DateOut, no nuclear carrier
#   2. extractor  — renewable + battery capacities scaled up to 2030 national
#                  targets, allocated per bus by land-availability p_nom_max
#                  (see --targets in extract_lower_saxony.py)
# We do NOT solve a capacity-expansion problem: an unclustered DE LP with
# extendable carriers is intractable on a workstation, and the benchmark only
# needs an installed-capacity dataset, not an optimisation result.
#
# Build (stop at prepare_network — no solve):
#   cd pypsa-eur
#   pixi shell            # or: conda activate pypsa-eur
#   snakemake --dry-run resources/lower-saxony-2030/networks/base_s_all_elec_2030.nc \
#             --configfile config/config.lower-saxony-2030.yaml
#   snakemake resources/lower-saxony-2030/networks/base_s_all_elec_2030.nc \
#             --configfile config/config.lower-saxony-2030.yaml -j8
#
# First run downloads databundles + the 2019 ERA5/SARAH-3 cutout for DE
# (tens of GB, a few hours). Later region extracts reuse everything.
# ─────────────────────────────────────────────────────────────────────────────

run:
  name: "lower-saxony-2030"          # resources/ + logs/ under this subdirectory
  shared_resources:
    policy: false                    # all outputs private to this run

foresight: overnight

scenario:
  clusters:
  - all                              # ← no clustering: keep every substation bus
  opts:
  - "2030"                           # embedded in filename: base_s_all_elec_2030.nc
  planning_horizons:
  - 2030

countries:
- DE
# Add first-degree neighbours if you later want border-exchange time series
# instead of an islanded extract (see extract_lower_saxony.py --border):
# - NL
# - DK
# - PL
# - CZ
# - AT
# - CH
# - FR
# - BE
# - LU

# ── Temporal scope ──────────────────────────────────────────────────────────
# 2030 has no weather; replay a recent complete weather year (2019, same cutout
# as config.elec_2019.yaml). Narrow this to a representative week for a quick
# first end-to-end test, e.g. start 2019-01-14 / end 2019-01-21.
snapshots:
  start: "2019-01-01"
  end: "2020-01-01"
  inclusive: left

enable:
  drop_leap_day: true                # 2019 is not a leap year anyway; harmless

# ── Electricity settings ────────────────────────────────────────────────────
electricity:
  base_network: osm
  gaslimit_enable: false
  co2limit_enable: false

  extendable_carriers:               # nothing extendable — installed fleet only
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

  max_hours:
    battery: 4
    H2: 168

  # Nuclear is fully phased out in Germany by 2023; drop the carrier entirely.
  conventional_carriers:
  - oil
  - OCGT
  - CCGT
  - coal
  - lignite
  - geothermal
  - waste
  - biomass

  renewable_carriers:
  - solar
  - onwind
  - offwind-ac
  - offwind-dc
  - hydro

  # Keep only units still operating in 2030 and commissioned by then.
  # powerplantmatching carries DateIn/DateOut incl. announced retirements;
  # this applies the coal exit and any lignite/nuclear closures with a
  # known end date. NaN (unknown) dates are kept.
  powerplants_filter: "(DateOut > 2030 or DateOut != DateOut) and (DateIn < 2031 or DateIn != DateIn)"

  # Calibrate *today's* renewable + battery fleet from powerplantmatching /
  # national statistics; the 2030 uplift is applied in the extractor so the
  # target numbers stay visible and editable.
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar
  estimate_battery_capacities: true

  autarky:
    enable: false

# ── Weather cutout (2019 ERA5 + SARAH-3 solar) ──────────────────────────────
atlite:
  default_cutout: "europe-2019-sarah3-era5"
  nprocesses: 4
  show_progress: false

# ── Load / demand ──────────────────────────────────────────────────────────
# Sub-national distribution to buses uses the JRC Energy Atlas raster with a
# NUTS3 fallback — exactly the regionalised demand the extract needs.
load:
  fixed_year: false
  fill_gaps:
    enable: true
    interpolate_limit: 6
    time_shift_for_large_gaps: 1w
  manual_adjustments: true
  scaling_factor: 1.0                 # scale to a 2030 demand projection here if wanted
  supplement_synthetic: true
  distribution_key:
    gdp: 0.6
    population: 0.4

# ── Technology costs — 2030 ────────────────────────────────────────────────
costs:
  year: 2030
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
    standing losses: 0

# ── Clustering — identity (no-op), required plumbing for `clusters: all` ────
clustering:
  mode: busmap
  focus_weights: false
  simplify_network:
    to_substations: false            # keep full substation topology
    remove_stubs: true
    remove_stubs_across_borders: false
  cluster_network:
    algorithm: kmeans
  temporal:
    resolution_elec: false           # native hourly

# ── Solver (only used if you ever solve; extract path never does) ──────────
solving:
  solver:
    name: highs
    options: highs-default
  solver_options:
    highs-default:
      threads: 4
      solver: ipm
      run_crossover: "off"
      parallel: "on"
      time_limit: 7200.
