# Consensus + innovations parameters (docs/consensus-plan.md §7 I4–I6, I11–I15).
# Routes (esb-run --tuning): paper = the [consensus] values below (the papers' numbers, used in
# MW / €/MWh as printed); manual = [consensus.<network>.<topology>.manual] (hand-tuned, with a
# note on how); sweep = [consensus.<network>.<topology>.sweep] (written by esb-tune).
# Default route: manual if present, else paper. esb-run --set key=value overrides any value.
[consensus]
steps = "decaying"  # or "constant"
# decaying: alpha_i = alpha0 / i^alpha_exp, beta_i = beta0 / i^beta_exp (HKW15 eq. 32)
alpha0 = 0.055
alpha_exp = 0.98
beta0 = 0.2
beta_exp = 0.001
# constant: alpha = kappa, beta = kappa * gamma (KH12 eq. 43, Fig. 4)
kappa = 0.003
gamma = 100.0
# stop (HKW15 eq. 33): max |Δλ| < eps_lambda (€/MWh) and every unit's max |ΔP| < eps_p * p_nom
eps_lambda = 1e-4
eps_p = 1e-3
max_iter = 10000
# per-agent steps (S3, deviation C2b): "none" = one α, β for all agents (the papers, paper route);
# "capacity" = bus j runs with s_j·α, s_j·β, s_j = median / its dispatchable capacity (esb-tune sets)
agent_scale = "none"

# toy (2024-01-01, 24 h): hand-tuned 2026-11-08; κ = 0.05, γ = 4 oscillates on ring/complete
# (α·dP/dλ at bus0 ≈ 1.75), κ = 0.03 is stable on all three; gap vs central −0.014 / −0.015 /
# −0.019 % (residual imbalance ≈ 0.2 MWh), 495 / 254 / 207 iterations.
[consensus.toy.grid.manual]
steps = "constant"
kappa = 0.03
gamma = 4.0
note = "hand-tuned on toy 24 h, 2026-11-08"

[consensus.toy.ring.manual]
steps = "constant"
kappa = 0.03
gamma = 4.0
note = "hand-tuned on toy 24 h, 2026-11-08"

[consensus.toy.complete.manual]
steps = "constant"
kappa = 0.03
gamma = 4.0
note = "hand-tuned on toy 24 h, 2026-11-08"

[consensus.synthetic_10.complete.sweep]
steps = "constant"
agent_scale = "capacity"
kappa = 0.002263
gamma = 4.0
note = "esb-tune (grid \u00d7 1/132.5 MW per \u20ac/MWh) best: constant agent_scale=capacity, kappa=0.002263, gamma=4.0 \u2014 24 h gap 2019-01-09 00:00:00: +0.0062%; 2019-04-15 00:00:00: +0.0131%; 2019-06-24 00:00:00: +0.0117%; 2019-10-25 00:00:00: +0.0131%, score 1.31e-04, 3000 it. | decaying agent_scale=capacity, alpha0=0.007545, beta0=0.003 \u2014 24 h gap 2019-01-09 00:00:00: -100.0000%; 2019-04-15 00:00:00: -100.0000%; 2019-06-24 00:00:00: -100.0000%; 2019-10-25 00:00:00: -100.0000%, score 1.85e+00, 3000 it."
