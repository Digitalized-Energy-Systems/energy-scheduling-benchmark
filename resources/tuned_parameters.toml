# Consensus + innovations parameters (docs/consensus-plan.md §7 I4–I6, I11–I15).
# Routes (esb-run --tuning): paper = the [consensus] values below (the papers' numbers, used in
# MW / €/MWh as printed); manual = [consensus.<network>.<topology>.manual] (hand-tuned, with a
# note on how); sweep = [consensus.<network>.<topology>.sweep] (written by esb-tune).
# Default route: manual if present, else sweep, else paper (with a warning; audit 2026-11-12 Q-A10).
# esb-run --set key=value overrides any value.
[consensus]
steps = "decaying"  # or "constant"
# decaying: alpha_i = alpha0 / i^alpha_exp, beta_i = beta0 / i^beta_exp (HKW15 eq. 32)
alpha0 = 0.055
alpha_exp = 0.98
beta0 = 0.2
beta_exp = 0.001
# constant: alpha = kappa, beta = kappa * gamma (KH12 eq. 43, Fig. 4)
kappa = 0.003
gamma = 100.0
# stop (HKW15 eq. 33): max |Δλ| < eps_lambda (€/MWh) and every unit's max |ΔP| < eps_p * p_nom
eps_lambda = 1e-4
eps_p = 1e-3
max_iter = 10000
# per-agent steps (S3, deviation C2b): "none" = one α, β for all agents (the papers, paper route);
# "capacity" = bus j runs with s_j·α, s_j·β, s_j = median / its dispatchable capacity (esb-tune sets)
agent_scale = "none"
# sweep-only divergence abort (audit 2026-11-12 T4): a bus agent ends the run once |λ| exceeds it
# (€/MWh; esb-tune sets 4000 = the slack import price), stop_reason "diverged"; inf = off
lam_abort = inf

# Exchange ADMM parameters (Boyd et al. 2011 §7.3.2; docs/admm-exchange-plan.md, D-117–D-135).
# Routes as consensus. paper = adaptive ρ eq. 3.13 (Boyd gives no fixed ρ; Q-E6, D-122);
# sweep = [admm.<network>.<topology>.sweep], a fixed ρ written by esb-tune.
[admm]
rho = 1.0  # ρ (€/MWh per MW); the start value when adaptive
adaptive = true  # residual balancing eq. 3.13: ρ·τ if ||r|| > μ||s||, ρ/τ if ||s|| > μ||r||
mu = 10.0
tau = 2.0
# stop (eq. 3.12, stacked 2-norms; Q-E5, D-121): ε_abs in MW per bus and hour
eps_abs = 1e-4
eps_rel = 1e-3
max_iter = 10000

# DEED-ADMM parameters (Zhu et al. 2025 Algorithm 1; docs/deed-admm-plan.md, D-126–D-133, D-175–D-177).
# Routes as consensus. paper = §V: W = I − βL with β = 0.2, γ = 0.05 (Q-Z3 A; diverges where
# β·λ_max(L) ≥ 2, a result); sweep = [deed_admm.<network>.<topology>.sweep] (β = g/λ_max(L), γ).
[deed_admm]
beta = 0.2
gamma = 0.05  # ADMM penalty γ (€/MWh per MW)
# stop (Q-Z4 A): ‖ξ_i‖ ≤ √T·ε_abs + ε_rel‖x_i‖ and γ‖Δp̂_i‖ ≤ √dim·ε_abs + ε_rel‖ν_i‖ per bus
eps_abs = 1e-4
eps_rel = 1e-3
max_iter = 10000

# Diffusion parameters (Ces et al. 2025 §3.3; docs/diffusion-plan.md, D-203–D-214). Routes as
# consensus. paper = Ces Table I, diffusion, dispatchable generator, islanded (ε₄ = 0.4603, a kW
# microgrid: stalls or diverges at our scale, a result); sweep = [diffusion.<network>.<topology>.sweep].
[diffusion]
eps_step = 0.4603  # ε; bus j runs s_j·ε
agent_scale = "capacity"  # per-agent ε (D-204, as Ces's per-agent gains); "none" = one ε
# stop (Ces §4, D-208): max |Δλ| ≤ eps_lambda (€/MWh) per agent, via the leader
eps_lambda = 1e-4
max_iter = 10000  # over all passes of the flag loop (D-213)
final_stop = true  # false (sweeps, D-214): pass ends stay, the run goes on to max_iter
lam_abort = inf  # sweep-only divergence abort (as consensus)

# toy (2024-01-01, 24 h): hand-tuned 2026-11-08; κ = 0.05, γ = 4 oscillates on ring/complete
# (α·dP/dλ at bus0 ≈ 1.75), κ = 0.03 is stable on all three; gap vs central −0.014 / −0.015 /
# −0.019 % (residual imbalance ≈ 0.2 MWh), 495 / 254 / 207 iterations.
[consensus.toy.grid.manual]
steps = "constant"
kappa = 0.03
gamma = 4.0
note = "hand-tuned on toy 24 h, 2026-11-08"

[consensus.toy.ring.manual]
steps = "constant"
kappa = 0.03
gamma = 4.0
note = "hand-tuned on toy 24 h, 2026-11-08"

[consensus.toy.complete.manual]
steps = "constant"
kappa = 0.03
gamma = 4.0
note = "hand-tuned on toy 24 h, 2026-11-08"

